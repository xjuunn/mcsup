[package]
name = "mcsup-backup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Backup, content-addressed storage, and snapshots for MCSUP"
repository.workspace = true

[lib]
name = "backup"

[dependencies]
domain = { package = "mcsup-domain", version = "0.1.0", path = "../domain" }
port = { package = "mcsup-port", version = "0.1.0", path = "../port" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.0"
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
testkit = { package = "mcsup-testkit", path = "../testkit" }
