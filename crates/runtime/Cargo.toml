[package]
name = "mcsup-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Minecraft process and JVM runtime management for MCSUP"
repository.workspace = true

[lib]
name = "runtime"

[dependencies]
domain = { package = "mcsup-domain", version = "0.1.0", path = "../domain" }
port = { package = "mcsup-port", version = "0.1.0", path = "../port" }
protocol = { package = "mcsup-protocol", version = "0.1.0", path = "../protocol" }
interprocess = "2.4.6"
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"

[target.'cfg(windows)'.dependencies]
# Job Object 的安全封装（workspace 禁止 unsafe）：supervisor 消失时由内核
# 收掉它拉起的服务端进程树，避免遗留 JVM 锁住 world/session.lock
win32job = "2.1.0"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
