[package]
name = "file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1.92"
domain = { path = "../domain" }
flate2 = "1.1.10"
port = { path = "../port" }
serde_json.workspace = true
sha1 = "0.11.0"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = [
    "fs",
    "io-util",
    "time",
    "sync",
    "rt",
    "macros",
] }
url = "2.5.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt"] }
