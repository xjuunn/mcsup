[package]
name = "mcsup-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Remote TLS transport and frame I/O for MCSUP"
repository.workspace = true

[lib]
name = "transport"

[dependencies]
# 契约层：帧类型与权限表都在 protocol，transport 只做「怎么把帧送过去」
protocol = { package = "mcsup-protocol", version = "0.1.0", path = "../protocol" }
# 长任务的观察者词表（阶段 / 进度 / 输出）由 port 定义，服务端回传时复用
port = { package = "mcsup-port", version = "0.1.0", path = "../port" }
auth = { package = "mcsup-auth", version = "0.1.0", path = "../auth" }
pem = "4.0"
# TLS：与 provider 同一套后端（rustls + ring），不引入 C 工具链
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pki-types = "1.15"
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true
