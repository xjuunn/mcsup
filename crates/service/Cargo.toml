[package]
name = "mcsup-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Business orchestration for MCSUP"
repository.workspace = true

[lib]
name = "service"

[dependencies]
async-trait.workspace = true
dirs.workspace = true
domain = { package = "mcsup-domain", version = "0.1.0", path = "../domain" }
port = { package = "mcsup-port", version = "0.1.0", path = "../port" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha1 = "0.11.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "macros", "rt", "fs", "sync"] }
toml.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
backup = { package = "mcsup-backup", path = "../backup" }
modkit = { package = "mcsup-modkit", path = "../modkit" }
service = { package = "mcsup-service", path = "." }
storage = { package = "mcsup-storage", path = "../storage" }
tempfile.workspace = true
testkit = { package = "mcsup-testkit", path = "../testkit" }
tokio = { workspace = true, features = ["macros", "rt"] }
uuid.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
