[package]
name = "mcsup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Professional-grade Minecraft server infrastructure management platform"
documentation = "https://docs.rs/mcsup"
readme = "../../README.md"
keywords = ["minecraft", "server", "management", "backup"]
categories = ["command-line-utilities", "database", "network-programming"]

[lints]
workspace = true

[dependencies]
auth = { path = "../auth", version = "0.1.0", optional = true }
domain = { path = "../domain", version = "0.1.0", optional = true }
port = { path = "../port", version = "0.1.0", optional = true }
protocol = { path = "../protocol", version = "0.1.0", optional = true }
service = { path = "../service", version = "0.1.0", optional = true }
backup = { path = "../backup", version = "0.1.0", optional = true }
backend = { path = "../backend", version = "0.1.0", optional = true }
transport = { path = "../transport", version = "0.1.0", optional = true }
file = { path = "../file", version = "0.1.0", optional = true }
java = { path = "../java", version = "0.1.0", optional = true }
provider = { path = "../provider", version = "0.1.0", optional = true }
storage = { path = "../storage", version = "0.1.0", optional = true }
runtime = { path = "../runtime", version = "0.1.0", optional = true }
thiserror = { workspace = true, optional = true }

[features]
default = []
domain = ["dep:domain"]
port = ["dep:port", "domain"]
protocol = ["dep:protocol", "auth", "port"]
service = ["dep:service", "port"]
backup = ["dep:backup", "port"]
backend = ["dep:backend", "port"]
file = ["dep:file", "port"]
java = ["dep:java", "port"]
provider = ["dep:provider", "port"]
storage = ["dep:storage", "port"]
runtime = ["dep:runtime", "port", "protocol"]
# 远端传输：TLS + 自签身份 + 帧收发（客户端与 agent 共用）
transport = ["dep:transport", "protocol"]
# 认证与授权：配对码 / token / 角色 / 凭证存储（纯逻辑，无网络）
auth = ["dep:auth"]
# 默认组合根：一次装配全部默认实现（storage/service/file/java/provider/runtime）
bootstrap = [
    "dep:storage",
    "dep:service",
    "dep:backup",
    "dep:backend",
    "dep:file",
    "dep:java",
    "dep:provider",
    "dep:runtime",
    "port",
    "protocol",
    "transport",
    "dep:thiserror",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
