[package]
name = "mcsup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Professional-grade Minecraft server infrastructure management platform"
documentation = "https://docs.rs/mcsup"
repository = "https://github.com/xjuunn/mcsup"
homepage = "https://github.com/xjuunn/mcsup"
readme = "../../README.md"
keywords = ["minecraft", "server", "management", "backup"]
categories = ["command-line-utilities", "database", "network-programming"]

[lints]
workspace = true

[dependencies]
auth = { package = "mcsup-auth", path = "../auth", version = "0.1.0", optional = true }
domain = { package = "mcsup-domain", path = "../domain", version = "0.1.0", optional = true }
port = { package = "mcsup-port", path = "../port", version = "0.1.0", optional = true }
protocol = { package = "mcsup-protocol", path = "../protocol", version = "0.1.0", optional = true }
service = { package = "mcsup-service", path = "../service", version = "0.1.0", optional = true }
backup = { package = "mcsup-backup", path = "../backup", version = "0.1.0", optional = true }
backend = { package = "mcsup-backend", path = "../backend", version = "0.1.0", optional = true }
transport = { package = "mcsup-transport", path = "../transport", version = "0.1.0", optional = true }
file = { package = "mcsup-file", path = "../file", version = "0.1.0", optional = true }
java = { package = "mcsup-java", path = "../java", version = "0.1.0", optional = true }
modkit = { package = "mcsup-modkit", path = "../modkit", version = "0.1.0", optional = true }
provider = { package = "mcsup-provider", path = "../provider", version = "0.1.0", optional = true }
storage = { package = "mcsup-storage", path = "../storage", version = "0.1.0", optional = true }
runtime = { package = "mcsup-runtime", path = "../runtime", version = "0.1.0", optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# 远端安装（`ServerInstall` 帧）要在同步的分发线程里跑 async 的下载编排：
# 每次请求起一个 current-thread runtime 阻塞执行，连接本身是一请求一线程
tokio = { workspace = true, features = ["rt"], optional = true }
# SSH 引导握手（`SshHandshake` / 配对码轮换行）是跨进程机器契约
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
domain = ["dep:domain"]
port = ["dep:port", "domain"]
protocol = ["dep:protocol", "auth", "port"]
service = ["dep:service", "port"]
backup = ["dep:backup", "port"]
backend = ["dep:backend", "port"]
file = ["dep:file", "port"]
java = ["dep:java", "port"]
modkit = ["dep:modkit", "port"]
provider = ["dep:provider", "port"]
storage = ["dep:storage", "port"]
runtime = ["dep:runtime", "port", "protocol"]
# 远端传输：TLS + 自签身份 + 帧收发（客户端与 agent 共用）
transport = ["dep:transport", "protocol"]
# 认证与授权：配对码 / token / 角色 / 凭证存储（纯逻辑，无网络）
auth = ["dep:auth"]
# 被连接端（agent）：把 transport::Handler 接到本机 service 上
#
# 依赖 `bootstrap`（要装配整套默认服务）与 `transport`（要监听与握手），
# 另外单独拉 `runtime`（supervisor 子进程入口 `__supervise`）。
remote = [
    "bootstrap",
    "transport",
    "runtime",
    "auth",
    "service",
    "protocol",
    "dep:thiserror",
    "dep:tracing",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
]
# 默认组合根：一次装配全部默认实现（storage/service/file/java/provider/runtime）
bootstrap = [
    "dep:storage",
    "dep:service",
    "dep:backup",
    "dep:backend",
    "dep:file",
    "dep:java",
    "dep:modkit",
    "dep:provider",
    "dep:runtime",
    "dep:tracing",
    "port",
    "protocol",
    "transport",
    "dep:thiserror",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tempfile.workspace = true
