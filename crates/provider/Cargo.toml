[package]
name = "provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1.92"
domain = { path = "../domain" }
port = { path = "../port" }
reqwest = { version = "0.13.5", features = ["json"] }
