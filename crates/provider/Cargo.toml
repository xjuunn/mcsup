[package]
name = "mcsup-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "External API, download, and third-party resource adapters for MCSUP"
repository.workspace = true

[lib]
name = "provider"

[dependencies]
async-trait.workspace = true
domain = { package = "mcsup-domain", version = "0.1.0", path = "../domain" }
port = { package = "mcsup-port", version = "0.1.0", path = "../port" }
# default-features = false 砍掉默认的 rustls(aws-lc-rs) 栈：aws-lc 要从源码
# 编译整套 C 库（cc/cmake 构建脚本 + 数百 C 文件），拖慢构建、放大 MSVC
# %TEMP% 依赖，对 Minecraft 服务器工具毫无必要。改用 rustls + ring：
# 全 Rust 实现（仅 ring 有少量预汇编），安全面足够，provider 代码零改动
# （reqwest API 不因 TLS 后端变化）。
#
# `system-proxy` 必须在砍掉默认特性后**重新显式打开**，否则会丢一个默认行为：
# 没有它 reqwest 只认环境变量，用户按系统设置配好的代理（Clash / Surge / 企业
# 代理，macOS 与 Windows 都由系统统一记录）对下载完全无效。实测同一份大整合包：
# 不走系统代理时并发 TLS 握手被上游拒掉、`tls handshake eof` 整包失败；走系统
# 代理后握手正常，同一份整合包下完。Linux 上该特性无实现，不会引入平台依赖。
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url.workspace = true
# zip 的 deflate-flate2 需要具体 zlib 后端；与 file 一样取 flate2 默认的
# rust_backend（纯 Rust），不额外引入 C 依赖
flate2 = "1.1.10"
# 与 file 保持同一版本与特性：解 `.mrpack` 不再依赖系统 unzip，归档内的
# 非 ASCII 文件名按 UTF-8 解码，避免系统 unzip 受 locale 影响产生乱码
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true

[dev-dependencies]
testkit = { package = "mcsup-testkit", path = "../testkit" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
