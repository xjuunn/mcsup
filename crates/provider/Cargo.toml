thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["time"] }
tracing.workspace = true
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1.53.2", features = ["macros", "rt"] }
