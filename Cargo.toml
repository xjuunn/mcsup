[workspace]
resolver = "3"
# crates/mcsup 是唯一发布单元。第一个 app 落地时在这里补上 "apps/*"：
members = ["apps/cli","crates/domain", "crates/file","crates/java", "crates/mcsup", "crates/port", "crates/protocol", "crates/provider", "crates/runtime", "crates/service", "crates/storage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

# CI 的 clippy 步骤以 `-D warnings` 运行，rustc 与 clippy 的 warn 都会让它失败。
# 版本统一在此声明（含 features 基线），成员一律 `xxx.workspace = true`，
# 需要追加 features 时写 `xxx = { workspace = true, features = [...] }`。
# 内层 crate 互依必须 `path + version` 双写：crates.io 发布时不接受 path-only
# 依赖，version 取自 workspace.version，由 scripts/bump-version.sh 一并推进。
[workspace.dependencies]
tracing = "0.1.44"
serde_json = "1.0.154"
serde = "1.0.229"
thiserror = "2.0.21"
async-trait = "0.1.92"
tokio = "1.53.2"
url = "2.5.8"
toml = "1.1.8"
uuid = { version = "1", features = ["v4"] }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

print_stdout = "warn"
print_stderr = "warn"
