# 发布前的许可证与 advisory 审计。
#
# mcsup 是要发布到 crates.io 的库，使用方会把它拉进自己的依赖树，因此
# 许可证策略必须是机器可执行的，不能靠 review 记忆。
#
# 策略：
#   - 只允许宽松许可，AGPL / GPL / SSPL 一律拒绝
#   - 通配符依赖（foo = "*"）直接拒绝，避免上游作者擅自改版本
#   - 同一 crate 多个版本只警告：tokio 这类生态里多个版本是常态，
#     硬拒绝会逼出无意义的版本 pin
#   - 允许的来源只有 crates.io

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# keyring 的 Linux Secret Service 后端（zbus → zvariant / zbus_names）被标记为
# unmaintained：上游已把它们并入 zbus 6，但 keyring 4 的 v1 兼容层尚未跟进，
# 且没有可安全升级的版本。这些 crate 只在 Linux 上编译（macOS / Windows 走
# Keychain / Credential Manager，不构建它们）；等 keyring 跟进 zbus 6 后移除。
ignore = [
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    # 0BSD：比 MIT 更宽松的公有领域等效许可（interprocess 的传递依赖）
    "0BSD",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]