[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mcsup"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0.104"
async-trait.workspace = true
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap-verbosity-flag = { version = "3.0", default-features = false, features = ["tracing"] }
clap_complete = "4.6.11"
comfy-table = "8"
console = "0.16.6"
crossterm = "0.29.0"
dirs.workspace = true
indicatif = "0.18.6"
inquire = "0.9.4"
mcsup = { path = "../../crates/mcsup", features = ["service", "backup", "file", "java", "modkit", "provider", "storage", "runtime", "bootstrap", "backend", "transport", "auth", "remote"] }
# Diagnostic 为手工实现；使用 GraphicalReportHandler，panic 由 std hook 处理。
# 不启用未调用的 miette::set_panic_hook；std / anyhow 的回溯能力不变。
miette = { version = "7.6.0", default-features = false, features = ["fancy-no-backtrace"] }
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
# 撤销列表拉取：与 provider 同一套 TLS 后端（rustls + ring）与系统代理行为，
# 避免 CLI 为一次 GET 再引入第二条 HTTP 栈。
reqwest = { version = "0.13.5", default-features = false, features = [
    "system-proxy",
    "rustls-no-provider",
    "blocking",
] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.0"
shell-words = "1.1.1"
sys-locale = "0.3.2"
# 交互式 setup 字段的临时密钥文件：插件写、宿主读，0600 目录隔离
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
