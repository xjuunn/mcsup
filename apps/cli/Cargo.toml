[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mcsup"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0.104"
async-trait.workspace = true
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap-verbosity-flag = { version = "3.0", default-features = false, features = ["tracing"] }
clap_complete = "4.6.11"
comfy-table = "8"
console = "0.16.6"
crossterm = "0.29.0"
dirs = "7.0.0"
indicatif = "0.18.6"
inquire = "0.9.4"
mcsup = { path = "../../crates/mcsup", features = ["service", "file", "java", "provider", "storage", "runtime", "bootstrap"] }
# Diagnostic 为手工实现；使用 GraphicalReportHandler，panic 由 std hook 处理。
# 不启用未调用的 miette::set_panic_hook；std / anyhow 的回溯能力不变。
miette = { version = "7.6.0", default-features = false, features = ["fancy-no-backtrace"] }
owo-colors = {version = "4.4.0"}
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shell-words = "1.1.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
