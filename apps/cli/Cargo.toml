[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mcsup"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap-verbosity-flag = { version = "3.0", default-features = false, features = ["tracing"] }
clap_complete = "4.6.11"
comfy-table = "8"
console = "0.16.6"
dirs = "7.0.0"
indicatif = "0.18.6"
inquire = "0.9.4"
mcsup = { path = "../../crates/mcsup", features = ["service", "file", "provider", "storage"] }
miette = { version = "7.6.0", features = ["fancy"] }
owo-colors = {version = "4.4.0"}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
