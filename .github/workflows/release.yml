name: Release CLI

# CLI 二进制发布：手动指定已存在的 v* tag 时跑完整门禁后构建各平台 mcsup
# 二进制并附到 GitHub Release。只发 CLI（bin 名 mcsup），不发 crates.io——
# crate 发布走 publish.yml，两者刻意分离：crates.io 发布不可撤销，且首次发布
# 前必须先完成内层 crate 的 mcsup-* 改名（见 docs/embedding.md 分发形态一节）。
#
# 只手动触发（workflow_dispatch）：与 test.yml 一致，推 tag 不自动跑，避免
# 每次打 tag 都消耗一轮多平台构建额度。tag 必填且必须是仓库里已存在的 tag
# （`git tag v0.2.0 && git push origin v0.2.0` 之后再来触发），三个 job 都按它
# checkout，产出的二进制版本与该 tag 一致。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（例如 v0.1.0）；必填，决定 Release 版本'
        required: true
        type: string

# 同一 tag 不并行发布：取消会留下半上传的 Release。
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  # 门禁与 test.yml 保持同一套命令；release 前必须全绿
  check:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 防止 tag 与产物版本错位：v0.2.0 打出 0.1.0 的二进制
      - name: tag matches workspace version
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          crate_version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "cli") | .version')
          echo "tag=$RELEASE_TAG cli=$crate_version"
          if [ "$version" != "$crate_version" ]; then
            echo "::error::tag $RELEASE_TAG 与 cli 包版本 $crate_version 不一致"
            exit 1
          fi
      - name: architecture
        run: sh scripts/check-architecture.sh
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --locked --workspace --all-features

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
            native: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar
            musl: true
            native: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar
            musl: true
            cross: true
          # windows-2022 而非 windows-latest：windows-latest 已切 VS2026 镜像，
          # 缺 v143 ARM64 MSVC 工具链（runner-images #14215）；2022 镜像带
          # VC.Tools.ARM64 + LLVM 20.1.8（ring 在 Windows AArch64 强制用
          # clang 编 C 代码，clang 必须在 PATH）。
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
            native: true
          - os: windows-2022
            target: aarch64-pc-windows-msvc
            archive: zip
          # macos-latest 是 arm64 runner：aarch64 原生编，x86_64 交叉编。
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
            native: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # 交叉编译 Linux ARM64 / musl ARM64：ring（rustls → reqwest）带 C/汇编，
      # cc-rs 找不到目标交叉 gcc 就失败。
      # - aarch64-gnu：Ubuntu 仓库有现成交叉 gcc，直接 apt 装。
      # - aarch64-musl：Ubuntu 仓库没有 musl ARM64 交叉包（musl-tools 只有
      #   x86_64），改用 cross（Docker 镜像内置 musl 交叉工具链），runner
      #   自带 Docker，零额外系统依赖。
      - name: install cross toolchain (aarch64-gnu)
        if: matrix.cross && !matrix.musl
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: install cross (aarch64-musl)
        if: matrix.cross && matrix.musl
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz -o /tmp/cross.tgz
          tar -xzf /tmp/cross.tgz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # musl x86_64：musl-tools 提供 musl-gcc，产物静态链接、无 glibc 依赖，
      # 老系统 / 容器 / Alpine 直接运行。
      - name: install musl tools (x86_64)
        if: matrix.musl && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Intel Mac 从 ARM runner 交叉编译：macos runner 自带 Apple clang + macOS
      # SDK，rustc 官方支持 clang 交叉编译 Apple 目标（SDK 自动探测），零配置；
      # ring 的 C 代码由 clang -target x86_64-apple-darwin 编译，同样零配置。
      - name: build mcsup
        if: matrix.target != 'aarch64-unknown-linux-musl'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p cli
      - name: build mcsup (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --locked --target ${{ matrix.target }} -p cli
      # 原生目标必须能跑起来，且版本与 tag 一致；交叉产物无法在这里验证。
      - name: smoke test (unix)
        if: matrix.native && matrix.archive == 'tar'
        run: |
          expected="${RELEASE_TAG#v}"
          actual=$("target/${{ matrix.target }}/release/mcsup" --version)
          echo "$actual"
          if [ "$actual" != "mcsup $expected" ]; then
            echo "::error::版本不匹配：$actual != mcsup $expected"
            exit 1
          fi
      - name: smoke test (windows)
        if: matrix.native && matrix.archive == 'zip'
        shell: pwsh
        run: |
          $expected = $env:RELEASE_TAG -replace '^v', ''
          $actual = & "target/${{ matrix.target }}/release/mcsup.exe" --version
          Write-Host $actual
          if ($actual -ne "mcsup $expected") {
            throw "版本不匹配：$actual != mcsup $expected"
          }
      # 打包目录放 staging/，dist/ 只留最终压缩包：上传与 release 的通配不会
      # 把解包目录一起带进 artifact。
      - name: package (unix)
        if: matrix.archive == 'tar'
        run: |
          name="mcsup-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "staging/$name" dist
          cp "target/${{ matrix.target }}/release/mcsup" "staging/$name/"
          cp README.md LICENSE "staging/$name/"
          tar -czf "dist/$name.tar.gz" -C staging "$name"
      - name: package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "mcsup-$env:RELEASE_TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "staging/$name", "dist" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mcsup.exe" "staging/$name/"
          Copy-Item README.md, LICENSE "staging/$name/"
          Compress-Archive -Path "staging/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mcsup-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          # v0.2.0-rc1 这类 tag 自动标预发布
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
