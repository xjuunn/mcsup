name: Release CLI

# CLI 二进制发布：推 v* tag 时跑完整门禁后构建各平台 mcsup 二进制并附到
# GitHub Release。只发 CLI（bin 名 mcsup），不发 crates.io——crate 发布走
# publish.yml，两者刻意分离：crates.io 发布不可撤销，且首次发布前必须先
# 完成内层 crate 的 mcsup-* 改名（见 docs/embedding.md 分发形态一节）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 门禁与 test.yml 保持同一套命令；release 前必须全绿
  check:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: architecture
        run: sh scripts/check-architecture.sh
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-features

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar
            musl: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar
            musl: true
            cross: true
          # windows-2022 而非 windows-latest：windows-latest 已切 VS2026 镜像，
          # 缺 v143 ARM64 MSVC 工具链（runner-images #14215）；2022 镜像带
          # VC.Tools.ARM64 + LLVM 20.1.8（ring 在 Windows AArch64 强制用
          # clang 编 C 代码，clang 必须在 PATH）。
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-2022
            target: aarch64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # 交叉编译 Linux ARM64 / musl ARM64：ring（rustls → reqwest）带 C/汇编，
      # cc-rs 找不到目标交叉 gcc 就失败。
      # - aarch64-gnu：Ubuntu 仓库有现成交叉 gcc，直接 apt 装。
      # - aarch64-musl：Ubuntu 仓库没有 musl ARM64 交叉包（musl-tools 只有
      #   x86_64），改用 cross（Docker 镜像内置 musl 交叉工具链），runner
      #   自带 Docker，零额外系统依赖。
      - name: install cross toolchain (aarch64-gnu)
        if: matrix.cross && !matrix.musl
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: install cross (aarch64-musl)
        if: matrix.cross && matrix.musl
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz -o /tmp/cross.tgz
          tar -xzf /tmp/cross.tgz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # musl x86_64：musl-tools 提供 musl-gcc，产物静态链接、无 glibc 依赖，
      # 老系统 / 容器 / Alpine 直接运行。
      - name: install musl tools (x86_64)
        if: matrix.musl && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Intel Mac 从 ARM runner 交叉编译：macos runner 自带 Apple clang + macOS
      # SDK，rustc 官方支持 clang 交叉编译 Apple 目标（SDK 自动探测），零配置；
      # ring 的 C 代码由 clang -target x86_64-apple-darwin 编译，同样零配置。
      - name: build mcsup
        if: matrix.target != 'aarch64-unknown-linux-musl'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} -p cli
      - name: build mcsup (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }} -p cli
      - name: package (unix)
        if: matrix.archive == 'tar'
        run: |
          name="mcsup-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/mcsup" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
      - name: package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "mcsup-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mcsup.exe" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mcsup-${{ matrix.target }}
          path: dist/*

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
