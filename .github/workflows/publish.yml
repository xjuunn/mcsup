name: Publish crates

# crates.io 发布：与 CLI 二进制 release（release.yml）刻意分离。
# 只能手动触发（workflow_dispatch）：crates.io 发布不可撤销，自动触发
# 容易在准备不充分时误发。发布按依赖拓扑序：内层先于门面；版本来自
# [workspace.package].version，由 scripts/bump-version.sh 一并推进。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run（只校验不上传）'
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 发布顺序：被依赖者先发。必须覆盖门面能 feature 拉入的每一个内层 crate，
  # 漏一个门面发布时 crates.io 就找不到依赖。modkit 曾在旧清单里漏掉。
  PUBLISH_CRATES: >-
    mcsup-domain mcsup-auth mcsup-port mcsup-protocol
    mcsup-file mcsup-java mcsup-provider mcsup-storage
    mcsup-backup mcsup-modkit mcsup-runtime mcsup-transport
    mcsup-service mcsup-backend

jobs:
  verify:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: verify workspace
        run: |
          set -eu
          sh scripts/check-architecture.sh
          cargo check --workspace --all-features
      # `cargo package --list` 只校验 manifest 与打包内容，不在预检阶段解析
      # crates.io：首次发布时内层依赖尚未上传，真正的 `cargo publish --dry-run`
      # 必然失败。真正上传仍逐个按拓扑序执行。
      - name: verify packageable
        run: |
          set -eu
          for pkg in $PUBLISH_CRATES mcsup; do
            cargo package -p "$pkg" --list >/dev/null
            echo "$pkg: packageable"
          done
      - name: verify version lockstep
        run: sh scripts/bump-version.sh "$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)" --check

  publish:
    name: publish inner crates
    needs: verify
    # dry_run=false 才真发布；默认只预检
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # 顺序执行，不能拆成并行 matrix：crates.io 要求依赖先于使用者出现。
      # CARGO_REGISTRY_TOKEN 由 GitHub Environment secret 提供。
      - name: publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          for pkg in $PUBLISH_CRATES; do
            echo "publishing $pkg"
            cargo publish -p "$pkg" --all-features
            # 给索引传播留出时间，下一跳的依赖解析才能看到刚上传的版本
            sleep 20
          done

  publish-facade:
    name: publish mcsup (facade)
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: publish mcsup
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p mcsup --all-features
