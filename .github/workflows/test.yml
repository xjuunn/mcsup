name: Test

# 只手动触发（workflow_dispatch）：GitHub Actions 额度有限，自动触发会让每次
# 提交都跑满 os × locale 矩阵，额度很快用光。需要 CI 信号时到 Actions 页面
# 手动 Run workflow，或 `gh workflow run test.yml --ref <分支>`。
# 同理不监听 push / pull_request / schedule，避免任何自动运行消耗额度：
# 深度检查（变异测试、联网探测）也只在手动触发时执行。
on:
  workflow_dispatch:
    inputs:
      deep:
        # 默认只跑必要门禁：一次点击就能拿到「能不能合入」的结论。
        # 变异测试、联网探测、feature powerset 都是深度检查，耗时长且
        # 不构成合入门槛，勾上才跑。
        description: '深度检查'
        type: boolean
        default: false

# 同一分支重复手动触发取消旧的运行，避免占用额度：group 仍按 ref 收敛。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # 用 sh 调用，不依赖 git 的可执行位。
      - name: check architecture rules
        run: sh scripts/check-architecture.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 用 `-- -D warnings` 而非 RUSTFLAGS：后者会连依赖的警告一起提升为错误。
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.lang }})
    runs-on: ${{ matrix.os }}
    # 卡住的测试要尽快暴露，而不是无声烧掉 GitHub 的 6 小时默认上限：
    # 曾经 `cli_serve_daemon` 在 Windows 上等一个永不关闭的管道，整个 job
    # 只能靠人工取消。冒烟预算是实测最慢平台的数倍，正常跑远远用不到。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 跑两种语言输入：locale 经 LANG 生效，`C` 与 `zh_CN` 分别
          # 覆盖「回退英文」与「中文」两条分支，也是 `help follows platform
          # locale` 里 case 的两个分支本身。曾另有一条 `en_US.UTF-8`，它与
          # `C` 都落到英文、走的是同一个 case 分支，属纯重复，已移除（两条
          # 解析路径 `Lang::parse("C") -> None` 与 `-> En` 由 locale.rs 的
          # 单元测试各自覆盖）。
          - os: ubuntu-latest
            lang: C
            lc_all: C
          - os: ubuntu-latest
            lang: zh_CN.UTF-8
            lc_all: zh_CN.UTF-8
          # Windows / macOS 只跑一条：两个平台都不读 LANG，这条验的是
          # 「locale 环境变量为空也不崩」，语言切换由显式 --lang 覆盖。
          # macOS 的 LANG 还会被安全 check-in 强制覆盖，设了也不生效。
          - os: windows-latest
            lang: C
            lc_all: ""
          - os: macos-latest
            lang: zh_CN.UTF-8
            lc_all: zh_CN.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # 断言测试不依赖运行机器的 locale：显式给出语言环境，结果必须仍然全绿。
      # 未设置 locale 的 Ubuntu 默认 C.UTF-8，中文用例会走回退路径，故显式指定。
      # 与本地同一个并行执行器：编译与 feature 组合等同于
      # `cargo test --workspace --all-features`（含 doctest），只是把串行的
      # 多个测试二进制并发起来。并发数按 CPU 与可用内存自适应，因此在
      # 2 核 / 7GB 的 runner 上不会超订。
      #
      # `shell: bash` 必须显式给：Windows runner 的默认 shell 是 pwsh，
      # 那样 `sh` 与脚本里的 xargs / awk 都不可用。给了 bash 之后，脚本
      # 自己的 Windows 分支会再回退成串行 `cargo test`（xargs 会吞掉
      # Windows 路径的反斜杠，并行在那边不成立）。
      - name: cargo test
        shell: bash
        env:
          LANG: ${{ matrix.lang }}
          LC_ALL: ${{ matrix.lc_all }}
          MCSUP_LANG: ""
          # 快照必须是「有人看过才更新」：CI 上发现差异就失败，不静默重写。
          # 原来这是独立的 snapshots job，但它要为此再编译一遍整个 workspace、
          # 再跑一次 cli_snapshots，而 test 这一步本来就跑了全部测试目标
          # （含 cli_snapshots）。合并后断言完全相同，少一份完整编译。
          INSTA_UPDATE: "no"
          INSTA_FORCE_PASS: "0"
        run: sh scripts/test-parallel.sh
      # insta 在 CI 上不会写 .snap.new，但会留在 testdata 里；这里兜一层：
      # 有人误把 `.snap.new` 提交进来时，必须当场发现。放在 test job 里是本
      # 步骤唯一的依赖——只查 git 索引，不需要编译。
      - name: reject pending snapshots
        shell: bash
        run: |
          found=$(git ls-files '*.snap.new' '*.pending-snap')
          if [ -n "$found" ]; then
            echo "仓库里存在未确认的快照，先 cargo insta review 再提交：" >&2
            echo "$found" >&2
            exit 1
          fi
      # 端到端单独成步：`cargo test --workspace` 虽会顺带跑 apps/cli/tests/cli_e2e.rs，
      # 但那是「碰巧」，不是约定。这里显式跑 check.sh 调用的同一个脚本，
      # 保证本地与 CI 跑的是同一组用例、同一套结论。
      - name: e2e
        shell: bash
        env:
          LANG: ${{ matrix.lang }}
          LC_ALL: ${{ matrix.lc_all }}
          MCSUP_LANG: ""
        run: sh scripts/check-e2e.sh
      # 下面两步都要用 `target/debug/mcsup`，而 `cargo test` 只构建测试
      # 目标、不产出 bin。单独一步构建，让「二进制从哪来」有唯一答案：
      # 靠上一步的副作用拿二进制，平台矩阵一改就变成 127（macOS 上正是
      # 如此——构建曾写在只在 Linux 跑的那一步里）。
      - name: build binary
        if: runner.os != 'Windows'
        run: cargo build -p cli
      # 语言矩阵下再验一次二进制本身：帮助必须能按环境给出正确语言。
      #
      # 只在 Linux 跑：`sys_locale` 在 Linux 读 LANG，在 macOS 读
      # `CFLocaleCopyPreferredLanguages()`（不读 LANG），在 Windows 读系统设置。
      # 在 macOS 上用 `case "$LANG"` 推导期望值会得到必然错误的结论——
      # macOS 的安全 check-in 还会强制覆盖 LANG，设什么都无效。
      - name: help follows platform locale
        if: runner.os == 'Linux'
        run: |
          help=$(target/debug/mcsup --help 2>&1)
          case "$LANG" in
            zh*) expected='用法:' ;;
            *)   expected='Usage:' ;;
          esac
          case "$help" in
            *"$expected"*) echo "OK: LANG=$LANG -> $expected" ;;
            *) echo "FAIL: LANG=$LANG 期望 '$expected'，实际输出：" >&2
               printf '%s\n' "$help" >&2
               exit 1 ;;
          esac
      # 显式 --lang 必须压过环境，两种取值都要验。
      # macOS 也跑这条：`--lang` 走显式分支，不读平台 locale，所以是有效断言。
      - name: explicit --lang overrides platform locale
        if: runner.os != 'Windows'
        run: |
          zh=$(target/debug/mcsup --help --lang zh 2>&1)
          en=$(target/debug/mcsup --help --lang en 2>&1)
          case "$zh" in *'用法:'*) ;; *) echo "FAIL: --lang zh 未给中文" >&2; exit 1 ;; esac
          case "$en" in *'Usage:'*) ;; *) echo "FAIL: --lang en 未给英文" >&2; exit 1 ;; esac
          echo "OK: --lang 压过 LANG=$LANG"

  # MSRV = [workspace.package] rust-version。clippy.toml 的 msrv 必须一致。
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    # 本 job 只写一处版本号：两个引用点都取自这里。写字面量两次的后果是
    # 改了一处忘了另一处，而漏改 RUSTUP_TOOLCHAIN 会让 job 静默跑
    # rust-toolchain.toml 的 1.98.1、绿得毫无意义。
    env:
      MSRV: "1.89"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      # 版本漂移是这道门禁唯一会静默失效的方式：Cargo.toml 升到 1.90 而本
      # job 仍钉 1.89 时，检查会通过但低估了真实 MSRV；反之本 job 低于
      # Cargo.toml 时 cargo 报的是「这些包要求 X」而不是兼容性结论，红得
      # 没有信息量。两边必须同值，所以在这里显式比对。
      - name: MSRV 声明一致
        run: |
          set -eu
          want_msrv=$(grep -E '^rust-version[[:space:]]*=' Cargo.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          clippy_msrv=$(sed -nE 's/^msrv[[:space:]]*=[[:space:]]*"(.*)"/\1/p' clippy.toml)
          printf 'workflow=%s Cargo.toml=%s clippy.toml=%s\n' "$MSRV" "$want_msrv" "$clippy_msrv"
          if [ "$want_msrv" != "$MSRV" ] || [ "$clippy_msrv" != "$MSRV" ]; then
            printf '::error::MSRV 不一致：Cargo.toml 的 rust-version、clippy.toml 的 msrv、本 job 的 MSRV 必须同为 %s（见 docs/development-workflow.md）\n' "$MSRV"
            exit 1
          fi
      # 必须覆盖 RUSTUP_TOOLCHAIN，否则根目录的 rust-toolchain.toml 会让本 job 静默跑 1.98.1。
      - name: cargo check
        env:
          RUSTUP_TOOLCHAIN: ${{ env.MSRV }}
        run: cargo check --workspace --all-targets --all-features

  # 要发布的库，文档警告等同缺陷。
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # --all-features 抓不到「单独开某个 feature 编译不过」，而那正是第三方安装的边界。
  # 需要 `cargo install cargo-hack` 并编译全部 feature 组合，耗时远超其余门禁，
  # 故归入深度检查（手动勾选 deep 才跑），不计入合入结论。
  features:
    name: feature powerset
    if: inputs.deep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-hack
        run: cargo install cargo-hack --locked
      - name: cargo hack check
        run: cargo hack check --workspace --feature-powerset --depth 1 --all-targets

  # 许可证与 advisory 审计。见 deny.toml。
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  # ---- 深度检查：不进常规门禁（太慢），只在手动 Run workflow 时执行 ----

  # 变异测试：检查「测试能不能发现实现被改坏」。基线阶段只报告，不卡阈值。
  mutants:
    name: mutants
    if: inputs.deep
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
      - name: install cargo-mutants
        run: cargo install cargo-mutants --locked
      # 只变异 domain + service：判定与编排的价值最高，成本也最可控
      - name: cargo mutants
        run: |
          cargo mutants -p domain -p service \
            --output mutants.out \
            --no-times || true
          echo '## 变异测试（基线：只报告）' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f mutants.out/outcomes.json ]; then
            jq -r '.[] | "\(.scenario.summary // "unknown")"' mutants.out/outcomes.json \
              | sort | uniq -c | sort -rn \
              | awk '{printf "| %s | %s |\n", $2, $1}' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out
          retention-days: 14

  # 真实网络探测：`#[ignore]` 的那组用例。常规门禁永远不跑它们，
  # 只有这里（手动触发）显式执行，失败说明上游改了契约。
  net:
    name: net (ignored tests)
    if: inputs.deep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: run ignored network tests
        run: cargo test -p provider --test forge_net -- --ignored --nocapture

  required:
    name: required checks
    if: always()
    needs: [architecture, fmt, clippy, test, msrv, docs, features, deny]
    runs-on: ubuntu-latest
    steps:
      # required 失败时必须指出是哪个 job：原来 jq 输出丢进 /dev/null，日志是空的。
      - name: Report job results
        run: |
          needs='${{ toJSON(needs) }}'

          {
            echo '## required checks'
            echo ''
            echo '| job | result |'
            echo '| --- | --- |'
            echo "$needs" | jq -r 'to_entries | sort_by(.key)[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          # `skipped` 不是失败：`features` 等深度检查在未勾选 deep 时不会
          # 运行，needs 里报 skipped。若把它当失败，默认路径将永远红。
          failed=$(echo "$needs" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key + " -> " + .value.result
          ')

          if [ -n "$failed" ]; then
            {
              echo ''
              echo '未通过的 job，具体原因见各自日志末尾：'
              echo ''
              echo '```'
              echo "$failed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo '未通过的 job，具体原因见各自日志末尾：' >&2
            echo "$failed" >&2
          fi

      - name: Verify all jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e '
            all(.[]; .result == "success" or .result == "skipped")
          ' > /dev/null
