name: Test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 取消旧的运行，避免占用额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # 用 sh 调用，不依赖 git 的可执行位。
      - name: check architecture rules
        run: sh scripts/check-architecture.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 用 `-- -D warnings` 而非 RUSTFLAGS：后者会连依赖的警告一起提升为错误。
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.lang }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 跑全语言组合：locale 经 LANG 生效，三种输入都要覆盖
          - os: ubuntu-latest
            lang: C
            lc_all: C
          - os: ubuntu-latest
            lang: zh_CN.UTF-8
            lc_all: zh_CN.UTF-8
          - os: ubuntu-latest
            lang: en_US.UTF-8
            lc_all: en_US.UTF-8
          # Windows / macOS 只跑一条：两个平台都不读 LANG，这条验的是
          # 「locale 环境变量为空也不崩」，语言切换由显式 --lang 覆盖。
          # macOS 的 LANG 还会被安全 check-in 强制覆盖，设了也不生效。
          - os: windows-latest
            lang: C
            lc_all: ""
          - os: macos-latest
            lang: zh_CN.UTF-8
            lc_all: zh_CN.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # 断言测试不依赖运行机器的 locale：显式给出语言环境，结果必须仍然全绿。
      # 未设置 locale 的 Ubuntu 默认 C.UTF-8，中文用例会走回退路径，故显式指定。
      - name: cargo test
        env:
          LANG: ${{ matrix.lang }}
          LC_ALL: ${{ matrix.lc_all }}
          MCSUP_LANG: ""
        run: cargo test --workspace --all-features
      # 端到端单独成步：`cargo test --workspace` 虽会顺带跑 tests/cli_e2e.rs，
      # 但那是「碰巧」，不是约定。这里显式跑 check.sh 调用的同一个脚本，
      # 保证本地与 CI 跑的是同一组用例、同一套结论。
      - name: e2e
        env:
          LANG: ${{ matrix.lang }}
          LC_ALL: ${{ matrix.lc_all }}
          MCSUP_LANG: ""
        run: sh scripts/check-e2e.sh
      # 语言矩阵下再验一次二进制本身：帮助必须能按环境给出正确语言。
      #
      # 只在 Linux 跑：`sys_locale` 在 Linux 读 LANG，在 macOS 读
      # `CFLocaleCopyPreferredLanguages()`（不读 LANG），在 Windows 读系统设置。
      # 在 macOS 上用 `case "$LANG"` 推导期望值会得到必然错误的结论——
      # macOS 的安全 check-in 还会强制覆盖 LANG，设什么都无效。
      - name: help follows platform locale
        if: runner.os == 'Linux'
        run: |
          # cargo test 只构建测试目标，二进制要单独构建
          cargo build -p cli
          help=$(target/debug/mcsup --help 2>&1)
          case "$LANG" in
            zh*) expected='用法:' ;;
            *)   expected='Usage:' ;;
          esac
          case "$help" in
            *"$expected"*) echo "OK: LANG=$LANG -> $expected" ;;
            *) echo "FAIL: LANG=$LANG 期望 '$expected'，实际输出：" >&2
               printf '%s\n' "$help" >&2
               exit 1 ;;
          esac
      # 显式 --lang 必须压过环境，两种取值都要验。
      # macOS 也跑这条：`--lang` 走显式分支，不读平台 locale，所以是有效断言。
      - name: explicit --lang overrides platform locale
        if: runner.os != 'Windows'
        run: |
          zh=$(target/debug/mcsup --help --lang zh 2>&1)
          en=$(target/debug/mcsup --help --lang en 2>&1)
          case "$zh" in *'用法:'*) ;; *) echo "FAIL: --lang zh 未给中文" >&2; exit 1 ;; esac
          case "$en" in *'Usage:'*) ;; *) echo "FAIL: --lang en 未给英文" >&2; exit 1 ;; esac
          echo "OK: --lang 压过 LANG=$LANG"

  # MSRV = [workspace.package] rust-version。clippy.toml 的 msrv 必须一致。
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88
      - uses: Swatinem/rust-cache@v2
      # 必须覆盖 RUSTUP_TOOLCHAIN，否则根目录的 rust-toolchain.toml 会让本 job 静默跑 1.98.1。
      - name: cargo check
        env:
          RUSTUP_TOOLCHAIN: 1.88
        run: cargo check --workspace --all-targets --all-features

  # 要发布的库，文档警告等同缺陷。
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # --all-features 抓不到「单独开某个 feature 编译不过」，而那正是第三方安装的边界。
  features:
    name: feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-hack
        run: cargo install cargo-hack --locked
      - name: cargo hack check
        run: cargo hack check --workspace --feature-powerset --depth 1 --all-targets

  # 许可证与 advisory 审计。见 deny.toml。
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  required:
    name: required checks
    if: always()
    needs: [architecture, fmt, clippy, test, msrv, docs, features, deny]
    runs-on: ubuntu-latest
    steps:
      # required 失败时必须指出是哪个 job：原来 jq 输出丢进 /dev/null，日志是空的。
      - name: Report job results
        run: |
          needs='${{ toJSON(needs) }}'

          {
            echo '## required checks'
            echo ''
            echo '| job | result |'
            echo '| --- | --- |'
            echo "$needs" | jq -r 'to_entries | sort_by(.key)[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          failed=$(echo "$needs" | jq -r '
            to_entries[]
            | select(.value.result != "success")
            | .key + " -> " + .value.result
          ')

          if [ -n "$failed" ]; then
            {
              echo ''
              echo '未通过的 job，具体原因见各自日志末尾：'
              echo ''
              echo '```'
              echo "$failed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo '未通过的 job，具体原因见各自日志末尾：' >&2
            echo "$failed" >&2
          fi

      - name: Verify all jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e '
            all(.[]; .result == "success")
          ' > /dev/null
