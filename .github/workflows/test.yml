name: Test

# 只手动触发（workflow_dispatch）：GitHub Actions 额度有限，自动触发会让每次
# 提交都跑满 os × locale 矩阵，额度很快用光。需要 CI 信号时到 Actions 页面
# 手动 Run workflow，或 `gh workflow run test.yml --ref <分支>`。
# 同理不监听 push / pull_request，避免任何提交自动消耗额度。
on:
  workflow_dispatch:
  # 夜间：跑白天的门禁装不下的深度检查（变异测试、联网探测）
  schedule:
    - cron: "0 18 * * *"

# 同一分支重复手动触发取消旧的运行，避免占用额度：group 仍按 ref 收敛。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # 用 sh 调用，不依赖 git 的可执行位。
      - name: check architecture rules
        run: sh scripts/check-architecture.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 用 `-- -D warnings` 而非 RUSTFLAGS：后者会连依赖的警告一起提升为错误。
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.lang }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 跑全语言组合：locale 经 LANG 生效，三种输入都要覆盖
          - os: ubuntu-latest
            lang: C
            lc_all: C
          - os: ubuntu-latest
            lang: zh_CN.UTF-8
            lc_all: zh_CN.UTF-8
          - os: ubuntu-latest
            lang: en_US.UTF-8
            lc_all: en_US.UTF-8
          # Windows / macOS 只跑一条：两个平台都不读 LANG，这条验的是
          # 「locale 环境变量为空也不崩」，语言切换由显式 --lang 覆盖。
          # macOS 的 LANG 还会被安全 check-in 强制覆盖，设了也不生效。
          - os: windows-latest
            lang: C
            lc_all: ""
          - os: macos-latest
            lang: zh_CN.UTF-8
            lc_all: zh_CN.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # 断言测试不依赖运行机器的 locale：显式给出语言环境，结果必须仍然全绿。
      # 未设置 locale 的 Ubuntu 默认 C.UTF-8，中文用例会走回退路径，故显式指定。
      - name: cargo test
        env:
          LANG: ${{ matrix.lang }}
          LC_ALL: ${{ matrix.lc_all }}
          MCSUP_LANG: ""
        run: cargo test --workspace --all-features
      # 端到端单独成步：`cargo test --workspace` 虽会顺带跑 tests/cli_e2e.rs，
      # 但那是「碰巧」，不是约定。这里显式跑 check.sh 调用的同一个脚本，
      # 保证本地与 CI 跑的是同一组用例、同一套结论。
      - name: e2e
        env:
          LANG: ${{ matrix.lang }}
          LC_ALL: ${{ matrix.lc_all }}
          MCSUP_LANG: ""
        run: sh scripts/check-e2e.sh
      # 语言矩阵下再验一次二进制本身：帮助必须能按环境给出正确语言。
      #
      # 只在 Linux 跑：`sys_locale` 在 Linux 读 LANG，在 macOS 读
      # `CFLocaleCopyPreferredLanguages()`（不读 LANG），在 Windows 读系统设置。
      # 在 macOS 上用 `case "$LANG"` 推导期望值会得到必然错误的结论——
      # macOS 的安全 check-in 还会强制覆盖 LANG，设什么都无效。
      - name: help follows platform locale
        if: runner.os == 'Linux'
        run: |
          # cargo test 只构建测试目标，二进制要单独构建
          cargo build -p cli
          help=$(target/debug/mcsup --help 2>&1)
          case "$LANG" in
            zh*) expected='用法:' ;;
            *)   expected='Usage:' ;;
          esac
          case "$help" in
            *"$expected"*) echo "OK: LANG=$LANG -> $expected" ;;
            *) echo "FAIL: LANG=$LANG 期望 '$expected'，实际输出：" >&2
               printf '%s\n' "$help" >&2
               exit 1 ;;
          esac
      # 显式 --lang 必须压过环境，两种取值都要验。
      # macOS 也跑这条：`--lang` 走显式分支，不读平台 locale，所以是有效断言。
      - name: explicit --lang overrides platform locale
        if: runner.os != 'Windows'
        run: |
          zh=$(target/debug/mcsup --help --lang zh 2>&1)
          en=$(target/debug/mcsup --help --lang en 2>&1)
          case "$zh" in *'用法:'*) ;; *) echo "FAIL: --lang zh 未给中文" >&2; exit 1 ;; esac
          case "$en" in *'Usage:'*) ;; *) echo "FAIL: --lang en 未给英文" >&2; exit 1 ;; esac
          echo "OK: --lang 压过 LANG=$LANG"

  # MSRV = [workspace.package] rust-version。clippy.toml 的 msrv 必须一致。
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88
      - uses: Swatinem/rust-cache@v2
      # 必须覆盖 RUSTUP_TOOLCHAIN，否则根目录的 rust-toolchain.toml 会让本 job 静默跑 1.98.1。
      - name: cargo check
        env:
          RUSTUP_TOOLCHAIN: 1.88
        run: cargo check --workspace --all-targets --all-features

  # 要发布的库，文档警告等同缺陷。
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # --all-features 抓不到「单独开某个 feature 编译不过」，而那正是第三方安装的边界。
  features:
    name: feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-hack
        run: cargo install cargo-hack --locked
      - name: cargo hack check
        run: cargo hack check --workspace --feature-powerset --depth 1 --all-targets

  # 许可证与 advisory 审计。见 deny.toml。
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  # 快照断言必须是「有人看过才更新」：CI 上发现 .snap.new 就是失败。
  # 与本地 `cargo insta review` 的分工：本地用它改，CI 只用来拦。
  snapshots:
    name: snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (snapshots)
        env:
          INSTA_UPDATE: "no"
          INSTA_FORCE_PASS: "0"
        run: cargo test --workspace --all-features --test cli_snapshots
      # insta 在 CI 上不会写 .snap.new，但会留在 testdata 里；这里再兜一层：
      # 有人误把 `.snap.new` 提交进来时，必须当场发现
      - name: reject pending snapshots
        run: |
          found=$(git ls-files '*.snap.new' '*.pending-snap')
          if [ -n "$found" ]; then
            echo "仓库里存在未确认的快照，先 cargo insta review 再提交：" >&2
            echo "$found" >&2
            exit 1
          fi

  # ---- 夜间深度检查：不进 PR 门禁（太慢），靠 cron 每天跑一次 ----

  # 变异测试：检查「测试能不能发现实现被改坏」。基线阶段只报告，不卡阈值。
  mutants:
    name: mutants
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
      - name: install cargo-mutants
        run: cargo install cargo-mutants --locked
      # 只变异 domain + service：判定与编排的价值最高，成本也最可控
      - name: cargo mutants
        run: |
          cargo mutants -p domain -p service \
            --output mutants.out \
            --no-times || true
          echo '## 变异测试（基线：只报告）' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f mutants.out/outcomes.json ]; then
            jq -r '.[] | "\(.scenario.summary // "unknown")"' mutants.out/outcomes.json \
              | sort | uniq -c | sort -rn \
              | awk '{printf "| %s | %s |\n", $2, $1}' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out
          retention-days: 14

  # 真实网络探测：`#[ignore]` 的那组用例。白天门禁永远不跑它们，
  # 只有这里（夜间）显式执行，失败说明上游改了契约。
  net:
    name: net (ignored tests)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: run ignored network tests
        run: cargo test -p provider --test forge_net -- --ignored --nocapture

  required:
    name: required checks
    if: always()
    needs: [architecture, fmt, clippy, test, msrv, docs, features, deny, snapshots]
    runs-on: ubuntu-latest
    steps:
      # required 失败时必须指出是哪个 job：原来 jq 输出丢进 /dev/null，日志是空的。
      - name: Report job results
        run: |
          needs='${{ toJSON(needs) }}'

          {
            echo '## required checks'
            echo ''
            echo '| job | result |'
            echo '| --- | --- |'
            echo "$needs" | jq -r 'to_entries | sort_by(.key)[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          failed=$(echo "$needs" | jq -r '
            to_entries[]
            | select(.value.result != "success")
            | .key + " -> " + .value.result
          ')

          if [ -n "$failed" ]; then
            {
              echo ''
              echo '未通过的 job，具体原因见各自日志末尾：'
              echo ''
              echo '```'
              echo "$failed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo '未通过的 job，具体原因见各自日志末尾：' >&2
            echo "$failed" >&2
          fi

      - name: Verify all jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e '
            all(.[]; .result == "success")
          ' > /dev/null
